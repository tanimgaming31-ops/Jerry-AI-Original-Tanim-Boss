name: Android Jerry original development
on:
  push:
    branches: [main, 'feature/jerry-original-phase1', 'feature/jerry-original-full-features', 'feature/jerry-pink-gold-home', 'feature/jerry-reference-ui-v2']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned SDK packages using preinstalled runner tools
        shell: bash
        run: |
          set -euo pipefail
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint, build APK and compile device tests
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Verify packaged action security contract
        run: python3 scripts/verify-foundation-apk.py
      - name: Prepare downloadable debug APK
        run: |
          mkdir -p build/artifacts
          cp app/build/outputs/apk/debug/app-debug.apk build/artifacts/jerry-ai-live-debug.apk
          cp FEATURE_STATUS.md build/artifacts/
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk > build/artifacts/SIGNING_CERTIFICATE.txt
          git diff-tree --no-commit-id --name-status -r HEAD > build/artifacts/CHANGED_FILES.txt
          printf '{"commit":"%s","run_id":"%s","device_verified":false,"provider_verified":false}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > build/artifacts/BUILD_INFO.json
          (cd build/artifacts && sha256sum jerry-ai-live-debug.apk > SHA256SUMS.txt)
          printf 'Debug build for commit `%s`. Device testing remains pending.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload APK
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: jerry-ai-live-debug-${{ github.run_number }}
          path: build/artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Add APK download link to run summary
        env:
          ARTIFACT_URL: ${{ steps.apk.outputs.artifact-url }}
        run: printf '[Download debug APK artifact](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
