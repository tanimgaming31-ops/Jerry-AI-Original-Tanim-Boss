name: Android confirmed actions
on:
  push:
    branches: [main, 'feature/jerry-original-phase1']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install pinned SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint, build APK and compile device tests
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Verify packaged action security contract
        run: python3 scripts/verify-foundation-apk.py
      - name: Prepare downloadable debug APK
        run: |
          mkdir -p build/artifacts
          cp app/build/outputs/apk/debug/app-debug.apk build/artifacts/jerry-ai-phase1-debug.apk
          cp FEATURE_STATUS.md build/artifacts/
          (cd build/artifacts && sha256sum jerry-ai-phase1-debug.apk > SHA256SUMS.txt)
          printf 'Debug build for commit `%s`. Device testing remains pending.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload APK
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: jerry-ai-phase1-debug-${{ github.run_number }}
          path: build/artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Add APK download link to run summary
        env:
          ARTIFACT_URL: ${{ steps.apk.outputs.artifact-url }}
        run: printf '[Download debug APK artifact](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
